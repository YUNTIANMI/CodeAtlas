# ============================================================
# CodeAtlas 前端 Nginx 配置
#
# 两项职责：
#   1. 托管 React 构建产物（SPA，带 history 路由回退）
#   2. 把 /api 与 /health 反向代理到后端容器
# 前端与接口同源，因此生产环境不涉及跨域。
# ============================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---------------- 上游服务名解析 ----------------
    # nginx 开源版对 proxy_pass 中的域名只在启动时解析一次并永久缓存，
    # 而后端容器一旦重建，IP 就会变化，nginx 会持续连向已失效的旧 IP，
    # 表现为 502「connect() failed (113: Host is unreachable)」。
    # 这里显式指定 Docker 内嵌 DNS，并改用变量形式，让 nginx 按周期重新解析。
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8080;

    # 后端文档上传上限为 20MB，这里留出 multipart 编码余量
    client_max_body_size 25m;

    # ---------------- 压缩 ----------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain
               text/css
               text/xml
               application/javascript
               application/json
               application/xml
               image/svg+xml;

    # ---------------- 安全响应头 ----------------
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # ---------------- 后端接口反向代理 ----------------
    location /api/ {
        # 用变量形式让 nginx 在请求时重新解析上游，避免后端换 IP 后 502。
        # 变量形式下未指定 URI，原始请求路径原样透传，与原先写法行为一致。
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # RAG 问答与 Agent 多步任务耗时较长，读超时放宽到 5 分钟
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # 上传大文件时不在 Nginx 侧落盘缓冲
        proxy_request_buffering off;
    }

    location = /health {
        # 请求路径本身即 /health，变量形式下原样透传到后端
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        access_log off;
    }

    # ---------------- 静态资源 ----------------
    # Vite 产物文件名带内容哈希，可长期强缓存。
    # 注意：nginx 中若子块出现 add_header，会覆盖外层的 add_header，
    # 因此这里重复声明安全响应头，避免在静态资源上失效。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;

        try_files $uri =404;
    }

    # index.html 不缓存，保证发版后立即引用到新的资源文件名
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
    }

    # ---------------- SPA 路由回退 ----------------
    # React Router 使用 history 模式，直接访问 /projects/1 这类子路径时
    # 服务端并不存在对应文件，需回退到 index.html 交给前端路由处理。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
