server:
  port: 8080

spring:
  application:
    name: codeatlas

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:23306}/${DB_NAME:codeatlas}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      continue-on-error: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:16379}

  servlet:
    multipart:
      # 单文件上限 20MB，但请求总大小必须留出余量：
      # multipart 请求体额外携带 boundary 与分段头部，
      # 若 max-request-size 与 max-file-size 同为 20MB，
      # 恰好 20MB 的文件会在进入业务校验前就被容器拒绝。
      max-file-size: 20MB
      max-request-size: 25MB

codeatlas:
  storage:
    type: ${STORAGE_TYPE:local}
    root: ${STORAGE_ROOT:./uploads}

  # AI 配置：API Key 一律从环境变量读取，禁止写进配置文件
  ai:
    chat:
      provider: ${AI_CHAT_PROVIDER:deepseek}
      model: ${AI_CHAT_MODEL:deepseek-chat}
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: ${AI_CHAT_BASE_URL:https://api.deepseek.com}
      timeout-seconds: 60
    embedding:
      provider: ${AI_EMBEDDING_PROVIDER:ollama}
      model: ${AI_EMBEDDING_MODEL:bge-m3}
      dimension: ${AI_EMBEDDING_DIMENSION:1024}
      base-url: ${AI_EMBEDDING_BASE_URL:http://localhost:11434}
      api-key: ${EMBEDDING_API_KEY:}
      batch-size: 16
      timeout-seconds: 60

  qdrant:
    host: ${QDRANT_HOST:localhost}
    port: ${QDRANT_PORT:6333}
    collection: ${QDRANT_COLLECTION:codeatlas}

  # Git 集成（只读，不提供任何写操作）
  git:
    github:
      api-base: ${GITHUB_API_BASE:https://api.github.com}
      token: ${GITHUB_TOKEN:}

  jwt:
    # 刻意不提供内置默认密钥：默认值一旦写进仓库即等同公开，
    # 攻击者可用它伪造任意用户（含管理员）的 Token，且服务端无法分辨真伪。
    # 未配置时后端会生成本进程随机密钥并打印告警（重启后登录态失效）。
    # 生产环境请在 .env 中配置固定密钥，生成方式见 .env.example。
    secret: ${JWT_SECRET:}
    expiration: ${JWT_EXPIRATION:7200}

  # 安全相关配置（Phase 11）
  security:
    # 登录失败限流：同一账号连续失败 max-attempts 次后锁定 lock-seconds 秒
    login:
      max-attempts: ${LOGIN_MAX_ATTEMPTS:5}
      lock-seconds: ${LOGIN_LOCK_SECONDS:900}

  # 跨域白名单：逗号分隔的完整来源（含协议与端口），禁止使用 * 通配
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

logging:
  level:
    root: INFO
    com.codeatlas: DEBUG
    org.hibernate.SQL: DEBUG
