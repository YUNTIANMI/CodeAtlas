server:
  port: 8080

spring:
  application:
    name: codeatlas

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:23306}/${DB_NAME:codeatlas}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      continue-on-error: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:16379}

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

codeatlas:
  storage:
    type: ${STORAGE_TYPE:local}
    root: ${STORAGE_ROOT:./uploads}

  # AI 配置：API Key 一律从环境变量读取，禁止写进配置文件
  ai:
    chat:
      provider: ${AI_CHAT_PROVIDER:deepseek}
      model: ${AI_CHAT_MODEL:deepseek-chat}
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: ${AI_CHAT_BASE_URL:https://api.deepseek.com}
      timeout-seconds: 60
    embedding:
      provider: ${AI_EMBEDDING_PROVIDER:ollama}
      model: ${AI_EMBEDDING_MODEL:bge-m3}
      dimension: ${AI_EMBEDDING_DIMENSION:1024}
      base-url: ${AI_EMBEDDING_BASE_URL:http://localhost:11434}
      api-key: ${EMBEDDING_API_KEY:}
      batch-size: 16
      timeout-seconds: 60

  qdrant:
    host: ${QDRANT_HOST:localhost}
    port: ${QDRANT_PORT:6333}
    collection: ${QDRANT_COLLECTION:codeatlas}

  jwt:
    secret: ${JWT_SECRET:codeatlas-default-secret-please-change-in-production-environment-32bytes}
    expiration: ${JWT_EXPIRATION:7200}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging:
  level:
    root: INFO
    com.codeatlas: DEBUG
    org.hibernate.SQL: DEBUG
