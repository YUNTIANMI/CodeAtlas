# ============================================================
# CodeAtlas 本地开发依赖环境（仅基础设施，不含前后端）
#
#   docker compose -f docker-compose.dev.yml up -d     启动
#   docker compose -f docker-compose.dev.yml ps        查看状态
#   docker compose -f docker-compose.dev.yml down      停止
#
# 用途：在后端用 mvn spring-boot:run、前端用 npm run dev 开发时，
# 只需要 MySQL / Redis / Qdrant 三个依赖服务。
#
# 端口说明：本机 3306 已被系统 MySQL 服务占用、6379 已被其他项目容器占用、
# 3308 落在 Hyper-V 保留端口段，因此本地环境错开使用 23306 / 16379。
# application.yml 的默认值已与之对应，启动后端无需额外配置。
#
# 注意：Embedding 服务未包含在此文件中，开发时请直接使用宿主机安装的
# Ollama（默认 http://localhost:11434）。若希望改用容器：
#   docker run -d --name codeatlas-ollama -p 11434:11434 \
#     -v codeatlas-ollama-data:/root/.ollama ollama/ollama:latest
# ============================================================

name: codeatlas-dev

services:
  mysql:
    image: mysql:8.4
    container_name: codeatlas-mysql
    ports:
      - "23306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-codeatlas}
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: codeatlas-redis
    ports:
      - "16379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    container_name: codeatlas-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage

volumes:
  mysql-data:
  redis-data:
  qdrant-data:
