# ============================================================
# CodeAtlas 完整系统 —— 一条命令启动全部服务
#
#   docker compose up -d --build      启动（首次会构建前后端镜像）
#   docker compose ps                 查看状态
#   docker compose logs -f backend    查看后端日志
#   docker compose down               停止（保留数据）
#   docker compose down -v            停止并清空所有数据
#
# 启动后访问：
#   前端        http://localhost:8081   （局域网内换成 http://<本机IP>:8081）
#   后端健康检查 http://localhost:8080/health
#
# 仅需要本地开发依赖（MySQL / Redis / Qdrant）时，请改用：
#   docker compose -f docker-compose.dev.yml up -d
#
# Embedding 模型由 ollama-init 服务自动拉取（约 1.2GB，仅首次），无需手动执行。
# 查看拉取进度：
#   docker compose logs -f ollama-init
#
# 注意：不要给 up 加 --wait 参数。ollama-init 是一次性容器，正常退出（Exited 0）
# 会被 --wait 判定为「启动失败」，导致命令以非 0 退出。
# ============================================================

name: codeatlas

services:

  # ---------------- 业务数据库 ----------------
  mysql:
    image: mysql:8.4
    container_name: codeatlas-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-codeatlas}
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # 用 MYSQL_PWD 而非 -p 传密码，避免密码含特殊字符时解析出错。
      # $$ 让变量在容器内展开，而不是被 compose 提前替换。
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - codeatlas-net

  # ---------------- 缓存 / 登录限流 / Token 黑名单 ----------------
  redis:
    image: redis:7-alpine
    container_name: codeatlas-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - codeatlas-net

  # ---------------- 向量知识库 ----------------
  qdrant:
    image: qdrant/qdrant:latest
    container_name: codeatlas-qdrant
    restart: unless-stopped
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - codeatlas-net

  # ---------------- 本地 Embedding 模型服务 ----------------
  # 免费、无需 API Key、可离线运行；模型数据落在 ollama-data 卷中。
  ollama:
    image: ollama/ollama:latest
    container_name: codeatlas-ollama
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    # 该镜像内没有 curl/wget，但自带 ollama CLI（/usr/bin/ollama）。
    # 用它对自身 API 发一次请求最可靠：服务未起来时返回非 0，起来了返回 0。
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    networks:
      - codeatlas-net

  # ---------------- Embedding 模型自动拉取（一次性任务）----------------
  # 首次部署的关键一步：启动后自动执行 `ollama pull`，拉完即退出。
  # 因此 `docker compose up -d` 之后无需再手动敲拉模型的命令。
  # 幂等：模型已存在于 ollama-data 卷时，这一步秒级完成。
  #
  # 容器状态最终显示为 Exited (0)，这是**正常**的，不是崩溃。
  # 若拉取失败（如网络不通），它同样会退出，用下面命令看原因：
  #   docker compose logs ollama-init
  ollama-init:
    image: ollama/ollama:latest
    container_name: codeatlas-ollama-init
    # 一次性任务，不随重启策略反复执行
    restart: "no"
    depends_on:
      # 必须等 Ollama 服务真正可接受请求，否则 ollama pull 会连接被拒
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      # 模型名跟随 AI_EMBEDDING_MODEL，换模型时两者自动保持一致
      EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-bge-m3}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "拉取 Embedding 模型：$$EMBEDDING_MODEL（首次约 1.2GB，请耐心等待）"
        ollama pull "$$EMBEDDING_MODEL"
        echo "Embedding 模型已就绪，可以开始构建知识库了。"
    networks:
      - codeatlas-net

  # ---------------- 后端 ----------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: codeatlas-backend:0.1.0
    container_name: codeatlas-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Qdrant 官方镜像不含 curl/wget，无法做可靠健康检查；
      # 且后端只在「构建知识库」时才访问向量库，启动阶段不做依赖。
      qdrant:
        condition: service_started
    environment:
      # --- 数据源：容器间通过服务名通信，端口用镜像内默认端口 ---
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-codeatlas}
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}

      # --- 缓存 ---
      REDIS_HOST: redis
      REDIS_PORT: 6379

      # --- 向量库 ---
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-codeatlas}

      # --- AI：默认使用 compose 内的 Ollama 做向量化 ---
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      AI_CHAT_PROVIDER: ${AI_CHAT_PROVIDER:-deepseek}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-deepseek-chat}
      AI_EMBEDDING_PROVIDER: ${AI_EMBEDDING_PROVIDER:-ollama}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-bge-m3}
      AI_EMBEDDING_DIMENSION: ${AI_EMBEDDING_DIMENSION:-1024}
      AI_EMBEDDING_BASE_URL: ${AI_EMBEDDING_BASE_URL:-http://ollama:11434}

      # --- 安全 ---
      # 不再提供占位默认值：占位密钥随源码公开，任何人可据此伪造 Token。
      # 留空时后端会自行生成随机密钥并告警（重启后需重新登录，多实例不互通）；
      # 生产部署务必在 .env 中配置固定密钥，./deploy.sh 会自动生成并写入。
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-7200}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8081}
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-5}
      LOGIN_LOCK_SECONDS: ${LOGIN_LOCK_SECONDS:-900}

      # --- Git 集成（只读）---
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}

      # --- 文件存储：容器内固定路径，由数据卷持久化 ---
      STORAGE_TYPE: local
      STORAGE_ROOT: /app/uploads

      TZ: Asia/Shanghai
    volumes:
      - backend-uploads:/app/uploads
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    networks:
      - codeatlas-net

  # ---------------- 前端 ----------------
  # Nginx 托管 React 静态资源，并把 /api 反向代理到 backend。
  # 前端与接口同源，因此生产环境不涉及跨域。
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    image: codeatlas-frontend:0.1.0
    container_name: codeatlas-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    networks:
      - codeatlas-net

volumes:
  mysql-data:
  redis-data:
  qdrant-data:
  ollama-data:
  backend-uploads:

networks:
  codeatlas-net:
    driver: bridge
