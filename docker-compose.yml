# 本地开发依赖环境
# 启动：docker compose up -d
# 停止：docker compose down
#
# 端口说明：本机 3306 已被系统 MySQL 服务占用、6379 已被其他项目容器占用、
# 3308 落在 Hyper-V 保留端口段，因此 CodeAtlas 本地环境使用 23306 / 16379。
# 应用配置（application.yml）的默认值已与之对应。

services:
  mysql:
    image: mysql:8.4
    container_name: codeatlas-mysql
    ports:
      - "23306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: codeatlas
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: codeatlas-redis
    ports:
      - "16379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    container_name: codeatlas-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage

volumes:
  mysql-data:
  redis-data:
  qdrant-data:
